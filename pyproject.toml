[project]
name = "compass"
version = "0.1.0"
description = "A background agent that watches university degree rules and speaks up only when silence would cost you something irreversible."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.55.1",
    "fastmcp>=2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8.0"]

[project.scripts]
compass = "compass.agents.compass:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
